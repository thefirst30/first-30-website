<!DOCTYPE html>
<html lang="en-AU">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#1c2d24">
  <meta name="description" content="Find The First 30 at Level 1, 180 George Street Community Space in Sydney CBD, or get in touch by email.">
  <title>Contact &amp; Location | The First 30</title>
  <link rel="canonical" href="https://thefirst30.com.au/contact/">
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&amp;family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/styles.css">
  <style>
    .contact-page {max-width:1040px; padding-block:clamp(44px,7vw,100px)}
    .contact-page h1 {margin-bottom:32px}
    .contact-page h2 {font-size:clamp(1.8rem,3vw,2.6rem); margin-bottom:14px}
    .contact-grid {display:grid; grid-template-columns:minmax(0,1fr) minmax(0,1.35fr); align-items:start; gap:clamp(28px,5vw,64px)}
    .contact-grid address {font-style:normal}
    .contact-grid p {margin-top:14px}
    .contact-grid section + section {margin-top:36px}
    .contact-map iframe {display:block; width:100%; height:clamp(300px,36vw,420px); border:1px solid #1c2d2440; border-radius:3px; background:var(--sage)}
    .contact-map .button {margin-top:16px}
    @media(max-width:720px) {.contact-grid {grid-template-columns:1fr}}
  </style>
</head>
<body>
  <header class="wrap"><nav class="nav" aria-label="Main navigation">
    <a class="brand" href="/">THE FIRST 30</a>
    <a class="button outline" href="/free-preview/">Free 9 Dec Preview</a>
  </nav></header>
  <main class="wrap contact-page">
    <h1>Find us in Sydney CBD.</h1>
    <div class="contact-grid">
      <div>
        <section aria-labelledby="contact-venue">
          <h2 id="contact-venue">Where we meet</h2>
          <address><strong>180 George Street Community Space</strong><br>Level 1, plaza building<br>180 George Street, Sydney NSW 2000</address>
          <p>Enter from the plaza and go up to Level 1.</p>
        </section>
        <section aria-labelledby="contact-email">
          <h2 id="contact-email">Get in touch</h2>
          <a href="mailto:hello@thefirst30.com.au">hello@thefirst30.com.au</a>
        </section>
      </div>
      <div class="contact-map">
        <iframe title="Map of 180 George Street Community Space" src="https://maps.google.com/maps?q=180%20George%20Street%20Community%20Space%2C%20180%20George%20Street%2C%20Sydney%20NSW%202000&amp;output=embed" loading="lazy" referrerpolicy="strict-origin-when-cross-origin"></iframe>
        <a class="button outline" href="https://www.google.com/maps/dir/?api=1&amp;destination=180%20George%20Street%20Community%20Space%2C%20180%20George%20Street%2C%20Sydney%20NSW%202000">Get directions</a>
      </div>
    </div>
  </main>
  <div class="wrap"><footer>
    <a class="brand" href="/">THE FIRST 30</a>
    <nav aria-label="Footer"><a href="/privacy/">Privacy Policy</a></nav>
  </footer></div>
</body>
</html>
