<!doctype html><html lang="en-AU"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>The 30-Minute Shift Model</title><style>
*{box-sizing:border-box}html,body{height:100%}body{margin:0;background:#0d1119}main{position:relative;overflow:hidden;width:100%;height:100%;min-height:270px;background:repeating-linear-gradient(90deg,transparent 0 calc(100% / 36 - 2px),#ffffff12 calc(100% / 36 - 2px) calc(100% / 36)),#0d1119;color:#f7f8fb;font-family:system-ui,sans-serif}canvas{position:absolute;inset:0;width:100%;height:100%}header,footer{position:absolute;left:4%;right:4%}header{top:5%;padding-right:56px}.model,#progress{color:#94a6bd;font:500 clamp(10px,1.6vw,17px)/1.3 ui-monospace,monospace}.model{margin:0 0 .35em}h1{margin:0;font-size:clamp(20px,2.85vw,33px);font-weight:500;letter-spacing:-.04em}button{cursor:pointer;font:inherit}button:focus-visible{outline:2px solid white;outline-offset:4px}#play{position:absolute;top:4%;right:3%;display:grid;place-items:center;width:clamp(38px,5.5vw,60px);aspect-ratio:1;border:1px solid #405064;border-radius:50%;background:#080b10;color:#e9eef7}#play svg{width:40%;height:40%;fill:currentColor}footer{bottom:5%;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:10px}#stage{color:#dda94e;background:#111929;border:1px solid #3b3633;border-radius:100px;padding:.4em .9em;text-align:left;font-size:clamp(11px,1.5vw,16px);font-weight:600}@media(max-width:560px){header,footer{left:5%;right:5%}footer{flex-direction:column;align-items:flex-start}h1{font-size:22px}#progress{font-size:10px}}
</style></head><body><main aria-label="Illustrative animation of the 30-minute session"><canvas id="waves" aria-hidden="true"></canvas><header><p class="model">THE 30-MINUTE SHIFT MODEL</p><h1 id="title" aria-live="polite">Arrive &amp; Decompress</h1></header><button id="play" type="button" aria-label="Pause animation"><svg viewBox="0 0 24 24" aria-hidden="true"><path id="icon"/></svg></button><footer><button id="stage" type="button" title="Go to the next stage">Stage 1: Downregulation</button><span id="progress">Minutes 00–05 · Stage Progress: 0%</span></footer></main><script>
const phases=[{title:'Arrive & Decompress',label:'Stage 1: Downregulation',range:'00–05',color:'212,158,73',duration:6500},{title:'The Guided Reset',label:'Stage 2: Interval training for your mind',range:'05–25',color:'75,140,217',duration:12000},{title:'The Shielding Ritual',label:'Stage 3: Deep Integration',range:'25–30',color:'51,161,78',duration:6500}];
const get=id=>document.getElementById(id),canvas=get('waves'),ctx=canvas.getContext('2d'),stage=get('stage'),progress=get('progress'),play=get('play'),tau=2*Math.PI;let playing=!matchMedia('(prefers-reduced-motion: reduce)').matches,index=0,elapsed=0,travel=0,last=performance.now(),width,height;
function smooth(from,to,value){const x=Math.min(1,Math.max(0,(value-from)/(to-from)));return x*x*(3-2*x)}
function motion(fraction){if(index===0){const urgency=1-smooth(.06,.86,fraction);return{amplitude:.037+.094*urgency,cycles:3.6+4.8*urgency,roughness:.07+.36*urgency,spacing:.3+.55*urgency,speed:1.3+6.6*urgency}}if(index===1){const round=(fraction*3)%1,effort=smooth(.04,.24,round)*(1-smooth(.43,.67,round));return{amplitude:.025+.112*effort,cycles:3.1+4.2*effort,roughness:.06+.25*effort,spacing:.23+.69*effort,speed:.95+5.7*effort}}return{amplitude:.024,cycles:3.6,roughness:.06,spacing:.16,speed:.68}}
function draw(settings,fraction){if(!width||!height)return;const phase=phases[index],status=`Minutes ${phase.range} · Stage Progress: ${Math.floor(fraction*100)}%`;if(progress.textContent!==status)progress.textContent=status;ctx.clearRect(0,0,width,height);const center=height/2,color=opacity=>`rgba(${phase.color},${opacity})`;function wave(x,strand){const u=x/width,envelope=.17+.83*Math.pow(Math.sin(Math.PI*u),.8),phaseAngle=tau*settings.cycles*u-travel+strand*settings.spacing;return center+height*settings.amplitude*envelope*(.85*Math.sin(phaseAngle)+settings.roughness*Math.sin(2.13*phaseAngle+strand*.8)+.13*Math.sin(.53*phaseAngle+travel*.31))}ctx.beginPath();ctx.setLineDash([5,11]);ctx.moveTo(0,center);ctx.lineTo(width,center);ctx.strokeStyle='#ffffff28';ctx.lineWidth=1;ctx.stroke();ctx.setLineDash([]);for(let strand=0;strand<6;strand++){ctx.beginPath();ctx.moveTo(0,wave(0,strand));for(let sample=1;sample<=220;sample++){const x=width*sample/220;ctx.lineTo(x,wave(x,strand))}ctx.strokeStyle=color(.24+strand*.075);ctx.lineWidth=strand===5?1.75:1.25;ctx.stroke()}const x=width*(.035+.93*fraction),y=wave(x,5),radius=Math.max(5,Math.min(11,width*.0085));ctx.beginPath();ctx.arc(x,y,radius*2.35,0,tau);ctx.strokeStyle=color(.42);ctx.lineWidth=1.6;ctx.stroke();ctx.beginPath();ctx.arc(x,y,radius,0,tau);ctx.fillStyle=color(.87);ctx.fill()}
function showStage(){get('title').textContent=phases[index].title;stage.textContent=phases[index].label;stage.setAttribute('aria-label',`${phases[index].label}. Go to the next stage.`)}function nextStage(){index=(index+1)%phases.length;elapsed=0;showStage()}function resize(){const bounds=canvas.getBoundingClientRect(),scale=Math.min(devicePixelRatio||1,2);width=bounds.width;height=bounds.height;canvas.width=Math.round(width*scale);canvas.height=Math.round(height*scale);ctx.setTransform(scale,0,0,scale,0,0);const fraction=elapsed/phases[index].duration;draw(motion(fraction),fraction)}function updatePlay(){play.setAttribute('aria-label',playing?'Pause animation':'Play animation');get('icon').setAttribute('d',playing?'M6 4h4v16H6z M14 4h4v16h-4z':'M7 4l14 8-14 8z')}play.addEventListener('click',()=>{playing=!playing;last=performance.now();updatePlay()});stage.addEventListener('click',()=>{nextStage();last=performance.now();draw(motion(0),0)});function tick(now){if(playing){const delta=Math.max(0,Math.min(now-last,50));elapsed+=delta;if(elapsed>=phases[index].duration)nextStage();const fraction=elapsed/phases[index].duration,settings=motion(fraction);travel+=settings.speed*delta/1000;draw(settings,fraction)}last=now;requestAnimationFrame(tick)}showStage();updatePlay();resize();new ResizeObserver(resize).observe(canvas);requestAnimationFrame(tick);
</script></body></html>
